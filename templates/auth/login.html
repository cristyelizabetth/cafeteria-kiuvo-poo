{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta-form">
  <h1>Iniciar sesión</h1>
  <form method="post" class="formulario" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Correo
      <input type="email" name="correo" value="{{ request.form.get('correo', '') }}" autocomplete="email" required>
    </label>
    <label>Contraseña
      <input type="password" name="contrasena" autocomplete="current-password" required>
    </label>
    <button type="submit" class="boton boton--ancho">Entrar</button>
  </form>
  <p class="form-enlaces">
    <a href="{{ url_for('auth.recuperar') }}">¿Olvidaste tu contraseña?</a>
    <a href="{{ url_for('auth.registro') }}">Crear una cuenta</a>
  </p>
</section>
{% endblock %}
